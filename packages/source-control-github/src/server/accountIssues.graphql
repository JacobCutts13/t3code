# Issues across every repository the account reaches, so each row also names its repository.
query AccountIssueSearch($q: String!, $cursor: String, $rows: Int!) {
  search(query: $q, type: ISSUE, first: $rows, after: $cursor) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      __typename
      ... on Issue {
        number
        title
        url
        state
        stateReason
        createdAt
        updatedAt
        closedAt
        author {
          login
          avatarUrl
          ... on User {
            name
          }
        }
        repository {
          nameWithOwner
        }
        assignees(first: 20) {
          nodes {
            login
            name
            avatarUrl
          }
        }
        labels(first: 20) {
          nodes {
            name
            color
          }
        }
        comments {
          totalCount
        }
      }
    }
  }
}
